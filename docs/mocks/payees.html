<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expendi Payees Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  --brand-50: #fff4f0;
  --brand-100: #ffe7de;
  --brand-500: #ff7e5f;
  --brand-600: #f0613e;
  --brand-700: #cc4528;
  --brand-800: #a63620;
  --gray-25: #fcfcfd;
  --gray-50: #f9fafb;
  --gray-100: #f2f4f7;
  --gray-200: #e4e7ec;
  --gray-300: #d0d5dd;
  --gray-400: #98a2b3;
  --gray-500: #667085;
  --gray-600: #475467;
  --gray-700: #344054;
  --gray-900: #101828;
  --error-50: #fef3f2;
  --error-700: #b42318;
  --warn-50: #fffaeb;
  --warn-600: #dc6803;
  --warn-700: #b54708;
  --success-50: #ecfdf3;
  --success-700: #067647;
  --blue-50: #eff8ff;
  --blue-500: #2e90fa;
  --blue-700: #175cd3;
  --amber-500: #f79009;
  --green-500: #17b26a;
  --red-500: #f04438;

  --bg: var(--gray-50);
  --surface: #ffffff;
  --text: var(--gray-900);
  --text-2: var(--gray-600);
  --text-3: var(--gray-500);
  --border: var(--gray-200);
  --hairline: var(--gray-100);
  /* Translucent so it stays visible on white, gray and coral row tints. */
  --row-divider: rgba(16, 24, 40, .08);
  --control-border: var(--gray-300);

  /* Shape rule: controls and business marks 8px, panels 14px, pills and people full. */
  --r-control: 8px;
  --r-panel: 14px;
  --r-full: 999px;
  --shadow-panel: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px -18px rgba(16, 24, 40, .16);
  --ease-out: cubic-bezier(.16, 1, .3, 1);

  /* Type weights by role (docs/design-system.md, Confident). */
  --w-display: 400; --w-heading: 400; --w-title: 600; --w-name: 600; --w-amount: 500; --w-ui: 500; --w-strong: 600; --w-button: 600; --w-figure: 600;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: Outfit, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p, dl, dd, ol, ul, figure { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 16px; height: 16px; flex: none; display: block; stroke-width: 1.75; }
:focus-visible { outline: 2px solid var(--brand-700); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ccy { font-size: .72em; font-weight: var(--w-ui); letter-spacing: .04em; color: var(--text-3); }
.money { white-space: nowrap; }
[hidden] { display: none !important; }

/* Shell */
.app { display: flex; min-height: 100dvh; }
.sidebar { position: sticky; top: 0; height: 100dvh; width: 248px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.sb-top { padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
.company { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 0; background: none; border-radius: var(--r-control); text-align: left; }
.company:hover { background: var(--gray-50); }
.company img { width: 32px; height: 32px; border-radius: var(--r-control); }
.company-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.company-name { font-weight: var(--w-name); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.company-role { font-size: 12px; line-height: 16px; color: var(--text-3); }
.company .ic { color: var(--gray-400); }
.search { display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r-control); background: var(--gray-50); color: var(--text-3); }
.search span { flex: 1; text-align: left; }
kbd { font: inherit; font-size: 11px; line-height: 16px; color: var(--text-3); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; background: var(--surface); }
.sb-nav { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
.sb-group { margin-top: 16px; }
.sb-label { padding: 0 8px 4px; font-size: 12px; line-height: 16px; color: var(--gray-400); font-weight: var(--w-ui); }
.sb-link { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border-radius: var(--r-control); color: var(--gray-700); text-decoration: none; transition: background-color .15s ease; }
.sb-link:hover { background: var(--gray-50); }
.sb-link .ic { color: var(--gray-400); }
.sb-link.is-active { background: var(--brand-50); color: var(--brand-800); font-weight: var(--w-ui); }
.sb-link.is-active .ic { color: var(--brand-700); }
.count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-full); background: var(--brand-100); color: var(--brand-800); font-size: 12px; font-weight: var(--w-strong); display: inline-flex; align-items: center; justify-content: center; }
.sb-user { display: flex; align-items: center; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--border); }
.sb-user .who { min-width: 0; }
.sb-user .who p:first-child { font-weight: var(--w-name); }
.sb-user .who p:last-child { font-size: 12px; line-height: 16px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: none; }
.main { width: 100%; max-width: 1320px; margin: 0 auto; padding: 24px 32px 72px; }

/* Atoms */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-panel); box-shadow: var(--shadow-panel); }
.person { width: 32px; height: 32px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-full); background: var(--gray-100); color: var(--gray-700); font-size: 12px; font-weight: var(--w-strong); letter-spacing: .02em; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px 0 6px; border-radius: var(--r-full); font-size: 12px; font-weight: var(--w-ui); white-space: nowrap; flex: none; }
.pill.plain { padding-left: 8px; }
.pill .ic { width: 13px; height: 13px; }
.pill-neutral { background: var(--gray-100); color: var(--gray-700); }
.pill-warn { background: var(--warn-50); color: var(--warn-700); }
.pill-error { background: var(--error-50); color: var(--error-700); }
.pill-success { background: var(--success-50); color: var(--success-700); }
/* Status: a filled tint means it needs attention or money is moving; an outline means it's only a record. Always a text label, never colour alone. */
.status { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border: 1px solid transparent; border-radius: var(--r-full); font-size: 12px; font-weight: var(--w-ui); white-space: nowrap; flex: none; }
.status.is-waiting { background: var(--warn-50); color: var(--warn-700); }
.status.is-moving { background: var(--blue-50); color: var(--blue-700); }
.status.is-paid { background: var(--success-50); color: var(--success-700); }
.status.is-failed { background: var(--error-50); color: var(--error-700); }
.status.is-rejected { background: var(--gray-100); color: var(--gray-700); }
.status.is-quiet { background: var(--surface); border-color: var(--border); color: var(--text-2); }
@keyframes beat { 0%, 100% { box-shadow: 0 0 0 0 rgba(46, 144, 250, .5); } 60% { box-shadow: 0 0 0 4px rgba(46, 144, 250, 0); } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-control); border: 1px solid transparent; font-size: 14px; font-weight: var(--w-button); white-space: nowrap; text-decoration: none; transition: background-color .15s ease, border-color .15s ease, transform .15s var(--ease-out); }
.btn .ic { width: 16px; height: 16px; }
.btn-primary { background: var(--brand-500); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--brand-600); }
.btn-outline { background: var(--surface); border-color: var(--control-border); color: var(--gray-700); }
.btn-outline:hover:not(:disabled) { background: var(--gray-50); }
.btn-ghost { background: none; color: var(--gray-600); }
.btn-ghost:hover:not(:disabled) { background: var(--gray-100); color: var(--gray-900); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; border-radius: var(--r-control); color: var(--gray-500); }
.icon-btn:hover:not(:disabled) { background: var(--gray-100); color: var(--gray-700); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.text-link { padding: 0; border: 0; background: none; border-radius: 4px; color: var(--brand-800); font-weight: var(--w-ui); text-decoration: underline; text-decoration-color: var(--brand-100); text-underline-offset: 3px; }
.text-link:hover { text-decoration-color: currentColor; }
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-control); font-size: 14px; line-height: 20px; }
.callout > .ic { margin-top: 2px; }
.callout-title { font-weight: var(--w-ui); }
.callout ul { margin: 4px 0 0; padding-left: 18px; }
.callout-warn { background: var(--warn-50); color: var(--warn-700); }
.callout-error { background: var(--error-50); color: var(--error-700); }
.callout-neutral { background: var(--gray-100); color: var(--gray-700); }
.skel { border-radius: var(--r-control); background: var(--gray-100); }

/* Mock-only strip */
.mock-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 12px; margin-bottom: 20px; border: 1px dashed var(--control-border); border-radius: var(--r-control); font-size: 12px; line-height: 16px; color: var(--text-3); }
.mock-strip strong { font-weight: 500; color: var(--text-2); }
.mock-strip label { display: inline-flex; align-items: center; gap: 6px; }
.mock-strip select { height: 28px; padding: 0 6px; border: 1px solid var(--control-border); border-radius: 6px; background: var(--surface); font-size: 12px; }

/* Page */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
.page-title { font-size: 24px; line-height: 32px; font-weight: var(--w-heading); letter-spacing: -0.02em; }
.page-sub { margin-top: 4px; color: var(--text-2); max-width: 70ch; }

.results { margin-top: 16px; overflow: clip; }
.results-body { transition: opacity .2s ease; }
.results-body.is-refreshing { opacity: .5; }

/* Kind tabs across the top of the table card */
.kind-tabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.kind-tabs::-webkit-scrollbar { display: none; }
.kind-tab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px; border: 0; background: none; color: var(--text-2); font-size: 14px; font-weight: var(--w-ui); white-space: nowrap; transition: color .15s ease; }
.kind-tab:hover { color: var(--text); }
.kind-tab[aria-selected="true"] { color: var(--text); }
.kind-tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--gray-900); }
.kind-count { min-width: 22px; height: 20px; padding: 0 6px; border-radius: var(--r-full); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; background: var(--gray-100); color: var(--gray-600); transition: background-color .15s ease, color .15s ease; }
.kind-tab[aria-selected="true"] .kind-count { background: var(--gray-900); color: #fff; }

/* Filter chips: dashed when empty, solid coral with a value and remove button when set */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--gray-25); }
.toolbar-label { display: inline-flex; align-items: center; gap: 6px; margin-right: 4px; font-size: 12px; line-height: 16px; font-weight: var(--w-ui); color: var(--text-3); }
.toolbar-label .ic { width: 14px; height: 14px; }
.fchip { display: inline-flex; align-items: stretch; height: 32px; border-radius: var(--r-full); font-size: 14px; min-width: 0; }
.fchip-main { display: inline-flex; align-items: center; gap: 6px; min-width: 0; padding: 0 12px; border: 1px dashed var(--gray-300); border-radius: var(--r-full); background: var(--surface); color: var(--gray-700); font-weight: var(--w-ui); transition: border-color .15s ease, background-color .15s ease, color .15s ease; }
.fchip-main .ic { width: 14px; height: 14px; color: var(--gray-500); }
.fchip-main:hover:not(:disabled) { border-style: solid; border-color: var(--gray-400); color: var(--text); }
.fchip-main[aria-expanded="true"] { border-style: solid; border-color: var(--gray-900); color: var(--text); }
.fchip-main:disabled { opacity: .5; cursor: not-allowed; }
.fchip.is-set .fchip-main { border: 1px solid var(--brand-100); border-right: 0; border-radius: var(--r-full) 0 0 var(--r-full); background: var(--brand-50); color: var(--brand-800); padding-right: 6px; }
.fchip.is-set .fchip-main .ic { color: var(--brand-700); }
.fchip.is-set .fchip-main:hover { background: var(--brand-100); }
.fchip.is-set .fchip-main[aria-expanded="true"] { border-color: var(--brand-700); }
.fchip-key { color: var(--brand-700); font-weight: 400; }
.fchip-value { font-weight: var(--w-name); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fchip-clear { display: inline-flex; align-items: center; justify-content: center; width: 30px; padding: 0 2px 0 0; border: 1px solid var(--brand-100); border-left: 0; border-radius: 0 var(--r-full) var(--r-full) 0; background: var(--brand-50); color: var(--brand-700); }
.fchip-clear:hover { background: var(--brand-100); color: var(--brand-800); }
.fchip-clear .ic { width: 14px; height: 14px; }
.toolbar .clear-all { margin-left: auto; font-size: 14px; }
.filter-error { display: flex; gap: 6px; align-items: center; padding: 8px 16px; font-size: 12px; line-height: 16px; color: var(--error-700); background: var(--error-50); border-bottom: 1px solid var(--border); }
.filter-error .ic { width: 14px; height: 14px; }

/* Filter menus */
.menu { position: fixed; z-index: 45; width: 264px; max-height: 340px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-panel); box-shadow: 0 16px 40px -12px rgba(16, 24, 40, .28); overflow: hidden; }
.menu-search { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--hairline); color: var(--text-3); }
.menu-search input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 14px; color: var(--text); }
.menu-search:focus-within { box-shadow: inset 0 -2px 0 var(--brand-700); }
.menu-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
.menu-list:focus { outline: none; }
.menu-option { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 8px; border-radius: var(--r-control); color: var(--gray-700); cursor: pointer; }
.menu-option.is-active { background: var(--brand-50); color: var(--brand-800); }
.menu-option[aria-selected="true"] { color: var(--text); font-weight: var(--w-ui); }
.menu-option .person { width: 24px; height: 24px; font-size: 11px; }
.menu-option .opt-icon { width: 24px; display: inline-flex; justify-content: center; color: var(--text-3); }
.menu-option .check { margin-left: auto; color: var(--brand-700); }
.menu-option:first-child { color: var(--text-2); }
.menu-empty { padding: 10px 8px; color: var(--text-3); }
@media (prefers-reduced-motion: no-preference) { .menu { animation: pop .14s var(--ease-out); } }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.stats { margin-top: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-width: 0; padding: 16px; text-align: left; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-panel); }
.stat-label { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; font-weight: var(--w-ui); color: var(--text-2); }
.stat-icon { width: 24px; height: 24px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-control); }
.stat-icon .ic { width: 14px; height: 14px; }
.stat-icon.is-total { background: var(--gray-100); color: var(--gray-600); }
.stat-icon.is-attention { background: var(--warn-50); color: var(--warn-700); }
.stat-icon.is-clear { background: var(--success-50); color: var(--success-700); }
.stat-value { margin-top: 6px; font-size: 24px; line-height: 32px; font-weight: var(--w-figure); letter-spacing: -0.02em; }
.stat-sub { font-size: 12px; line-height: 16px; color: var(--text-3); }
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .stat { padding: 14px; } }
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: separate; border-spacing: 0; }
table.data thead th { padding: 10px 16px; text-align: left; font-size: 12px; line-height: 16px; font-weight: var(--w-ui); color: var(--text-3); background: var(--gray-25); border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data th.right, table.data td.right { text-align: right; }
table.data tbody td { padding: 12px 16px; border-bottom: 1px solid var(--row-divider); vertical-align: top; }
table.data tbody tr.row { cursor: pointer; transition: background-color .15s ease; }
table.data tbody tr.row:hover { background: var(--gray-25); }
table.data tbody tr.row.is-open { background: var(--gray-50); box-shadow: inset 3px 0 0 var(--gray-900); }
.cell-date { white-space: nowrap; color: var(--text-2); }
.merchant { display: block; padding: 0; border: 0; background: none; text-align: left; font-size: 16px; line-height: 24px; font-weight: var(--w-name); color: var(--text); border-radius: 4px; }
.merchant:hover { text-decoration: underline; text-decoration-color: var(--gray-300); text-underline-offset: 3px; }
.meta { display: block; color: var(--text-3); }
.flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.flags:empty { display: none; }
.person-cell { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.amount { font-size: 16px; line-height: 24px; font-weight: var(--w-amount); white-space: nowrap; }
.etims { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.etims .ic { width: 14px; height: 14px; }
.etims.is-attached { color: var(--gray-700); }
.etims.is-attached .ic { color: var(--success-700); }
.etims.is-missing { color: var(--warn-700); }
.etims.is-na { color: var(--text-3); }
.results-foot { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--text-3); font-size: 12px; }
.empty, .load-error { padding: 56px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--text-2); }
.empty .ic, .load-error .ic { width: 28px; height: 28px; color: var(--text-3); }
.load-error .ic { color: var(--error-700); }
.empty strong, .load-error strong { color: var(--text); font-weight: var(--w-title); font-size: 16px; line-height: 24px; }
.cards { display: none; list-style: none; padding: 0; }
.cards li { border-bottom: 1px solid var(--row-divider); }
.card-btn { width: 100%; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 16px; border: 0; background: none; text-align: left; }
.card-name { display: block; font-size: 16px; line-height: 24px; font-weight: var(--w-name); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-sub { display: block; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-month { padding: 14px 16px 6px; font-size: 12px; line-height: 16px; font-weight: var(--w-ui); color: var(--text-3); border-bottom: 1px solid var(--row-divider); }
.skel-row td { padding: 16px; }

/* Side panel */
.sheet-layer { position: fixed; inset: 0; z-index: 50; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(16, 24, 40, .24); }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%); display: flex; flex-direction: column; background: var(--surface); box-shadow: -16px 0 48px -16px rgba(16, 24, 40, .2); }
.sheet:focus { outline: none; }
.sheet-head { display: flex; gap: 8px; align-items: flex-start; padding: 20px 16px 18px 24px; border-bottom: 1px solid var(--border); }
.sheet-head-main { flex: 1; min-width: 0; }
.eyebrow { font-size: 12px; line-height: 16px; color: var(--text-3); }
.sheet-title { margin-top: 2px; font-size: 18px; line-height: 26px; font-weight: var(--w-title); overflow-wrap: anywhere; }
.sheet-amount { margin-top: 2px; font-size: 24px; line-height: 32px; font-weight: var(--w-heading); letter-spacing: -0.02em; }
.sheet-head .status { margin-top: 8px; }
.stepper { display: flex; gap: 2px; }

<body>

function icon(name) {
  const node = window.lucide?.[LUCIDE_NAMES[name]];
  if (!node) return document.createElement("span");
  const svg = window.lucide.createElement(node);
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("class", "ic");
  svg.removeAttribute("width");
  svg.removeAttribute("height");
  return svg;
}
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (value == null || value === false) continue;
    if (key === "class") el.className = value;
    else if (key === "text") el.textContent = value;
    else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) if (child != null && child !== false) el.append(child);
  return el;
}

/* What the API shows for a payee */

const confirmedNumber = (confirmed) => (confirmed === false ? "Their confirmed number (not confirmed yet)" : "Their confirmed number");
function detailSummary(details, confirmed) {
  switch (details.method) {
    case "mpesa_phone": return details.phone ?? confirmedNumber(confirmed);
    case "mpesa_till": return details.tillNumber;
    case "mpesa_paybill": return `${details.paybillNumber}, account ${details.accountReference}`;
    case "bank": return `${bankName(details.bankCode) ?? details.bankCode} ${details.accountNumber}`;
    case "usdc": return shortAddress(details.address);
    default: return null;
  }
}
function listSummary(details, confirmed) {
  if (!details) return "No payment details yet";
  const detail = detailSummary(details, confirmed);
  return detail === null ? METHOD_LABELS[details.method] : `${METHOD_LABELS[details.method]} · ${detail}`;
}
function detailRows(details, confirmed) {
  const value = (field) => {
    if (details[field] === undefined) return confirmedNumber(confirmed);
    return field === "bankCode" ? bankName(details.bankCode) ?? details.bankCode : details[field];
  };
  return [["Paid by", METHOD_LABELS[details.method]], ...METHOD_FIELDS[details.method].map((field) => [fieldLabel(details.method, field), value(field)])];
}

/* State: tab, filters, search and the open payee live in the URL */
const state = { role: "admin", scenario: "normal", payees: [], filters: {}, sort: { key: "name", dir: "asc" }, loading: true, loadError: false, banksLoaded: false, expiredUsed: false };
const FILTER_NAMES = ["tab", "kind", "method", "q"];
const canAct = () => state.role !== "accountant";
const hasPasskey = () => state.role === "admin";
const tab = () => state.filters.tab ?? "active";
const tabOf = (p) => (p.archived ? "archived" : "active");
const matchesSearch = (name, search) => { const q = (search ?? "").trim().toLocaleLowerCase(); return q === "" || name.toLocaleLowerCase().includes(q); };
const PREDICATES = {
  tab: (p, v) => tabOf(p) === v,
  kind: (p, v) => p.kind === v,
  method: (p, v) => p.details?.method === v,
  q: (p, v) => matchesSearch(p.name, v),
};
function matchesExcept(p, skip) {
  const f = { tab: "active", ...state.filters };
  return Object.entries(f).every(([name, value]) => skip.includes(name) || PREDICATES[name](p, value));
}
const filtered = () => state.payees.filter((p) => matchesExcept(p, []));
const methodRank = (p) => (p.details ? PAYEE_METHODS.indexOf(p.details.method) : PAYEE_METHODS.length);
function comparePayees(a, b) {
  const { key, dir } = state.sort;
  const byName = a.name.localeCompare(b.name);
  const primary = key === "method" ? methodRank(a) - methodRank(b) : key === "changed" ? (a.changedAt ?? 0) - (b.changedAt ?? 0) : byName;
  return (dir === "asc" ? primary : -primary) || byName;
}
const sortedVisible = () => filtered().sort(comparePayees);
function setSort(key) {
  const current = state.sort;
  const firstDir = { name: "asc", method: "asc", changed: "desc" }[key];
  state.sort = current.key === key ? { key, dir: current.dir === "asc" ? "desc" : "asc" } : { key, dir: firstDir };
  keepFocus(renderResults);
}

function readUrl() {
  const params = new URLSearchParams(location.search);
  const f = {};
  for (const name of FILTER_NAMES) { const v = params.get(name); if (v) f[name] = v; }
  if (f.tab && f.tab !== "archived") delete f.tab;
  if (f.kind && !KIND_LABELS[f.kind]) delete f.kind;
  if (f.method && !METHOD_LABELS[f.method]) delete f.method;
  return { filters: f, payeeId: params.get("id") };
}
function writeUrl() {
  const params = new URLSearchParams();
  for (const name of FILTER_NAMES) if (state.filters[name]) params.set(name, state.filters[name]);
  if (openId) params.set("id", openId);
  const query = params.toString();

/* The schema's checks, with its own messages (packages/shared payeeDetailsSchema) */

  const fail = (field, message) => { errors[field] ??= message; };
  for (const field of detailFields(method, kind)) {
    const raw = values[field] ?? "";
    const trimmed = raw.trim();
    const compact = raw.replace(/\s+/g, "");
    if (field === "phone") { if (!trimmed) fail(field, "Enter the M-Pesa number."); details.phone = trimmed; }
    if (field === "tillNumber") { if (!/^\d{5,7}$/.test(compact)) fail(field, "A Till number is 5 to 7 digits."); details.tillNumber = compact; }
    if (field === "paybillNumber") { if (!/^\d{5,7}$/.test(compact)) fail(field, "A Paybill number is 5 to 7 digits."); details.paybillNumber = compact; }
    if (field === "accountReference") {
      if (!trimmed) fail(field, "Enter the Paybill account number.");
      else if (trimmed.length > REFERENCE_MAX) fail(field, `A Paybill account number is at most ${REFERENCE_MAX} characters.`);
      details.accountReference = trimmed;
    }
    if (field === "bankCode") { if (!trimmed) fail(field, "Choose the bank."); details.bankCode = trimmed; }
    if (field === "accountNumber") { if (!/^[0-9A-Za-z]{5,20}$/.test(compact)) fail(field, "A bank account number is 5 to 20 letters and digits."); details.accountNumber = compact; }
    if (field === "accountName") {
      if (!trimmed) fail(field, "Enter the name on the account.");
      else if (trimmed.length > ACCOUNT_NAME_MAX) fail(field, `Keep the account name to ${ACCOUNT_NAME_MAX} characters or fewer.`);
      details.accountName = trimmed;
    }
    if (field === "address") { if (!/^0x[0-9a-fA-F]{40}$/.test(trimmed)) fail(field, "That isn't a Base address."); details.address = trimmed; }
  }
  return Object.keys(errors).length ? { ok: false, errors } : { ok: true, details };
}

/* What the API does next: normalise (M-Pesa number to E.164, address to lowercase, single spaces) and refuse what it won't save */
function normalise(details) {

  if (out.accountName !== undefined) out.accountName = out.accountName.replace(/\s+/g, " ");
  if (out.address !== undefined) out.address = out.address.toLowerCase();
  if (out.phone !== undefined) {
    const match = out.phone.replace(/[\s-]/g, "").match(/^(?:\+?254|0)?([71]\d{8})$/);

}

  openId = null;
  renderAll();
  later(() => {
    state.loading = false;
    state.loadError = state.scenario === "error";
    renderAll();
    const linked = fromUrl.payeeId && !state.loadError ? payeeById(fromUrl.payeeId) : null;
    if (linked) {
      if (tabOf(linked) !== tab()) {
        if (linked.archived) state.filters.tab = "archived"; else delete state.filters.tab;
        renderAll();
      }
      openPayee(linked.id);
    }
  }, 600);
}
$("#mock-role").addEventListener("change", reset);
$("#mock-scenario").addEventListener("change", reset);

/* Mobile navigation */
const sidebar = $("#sidebar");
const scrim = $("#scrim");
const menuBtn = $("#menu-btn");
function setNav(isOpenNow) {
  sidebar.classList.toggle("is-open", isOpenNow);
  scrim.hidden = !isOpenNow;
  menuBtn.setAttribute("aria-expanded", String(isOpenNow));
  if (isOpenNow) sidebar.querySelector(".sb-link")?.focus();
}
menuBtn.addEventListener("click", () => setNav(true));
scrim.addEventListener("click", () => setNav(false));
document.addEventListener("keydown", (event) => { if (event.key === "Escape" && sidebar.classList.contains("is-open")) { setNav(false); menuBtn.focus(); } });

reset();
</script>
