<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expendi Approvals Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  --brand-50: #fff4f0;
  --brand-100: #ffe7de;
  --brand-500: #ff7e5f;
  --brand-600: #f0613e;
  --brand-700: #cc4528;
  --brand-800: #a63620;
  --gray-25: #fcfcfd;
  --gray-50: #f9fafb;
  --gray-100: #f2f4f7;
  --gray-200: #e4e7ec;
  --gray-300: #d0d5dd;
  --gray-400: #98a2b3;
  --gray-500: #667085;
  --gray-600: #475467;
  --gray-700: #344054;
  --gray-900: #101828;
  --error-50: #fef3f2;
  --error-700: #b42318;
  --warn-50: #fffaeb;
  --warn-600: #dc6803;
  --warn-700: #b54708;
  --success-50: #ecfdf3;
  --success-700: #067647;
  --blue-50: #eff8ff;
  --blue-500: #2e90fa;
  --blue-700: #175cd3;
  --amber-500: #f79009;
  --green-500: #17b26a;
  --red-500: #f04438;

  --bg: var(--gray-50);
  --surface: #ffffff;
  --text: var(--gray-900);
  --text-2: var(--gray-600);
  --text-3: var(--gray-500);
  --border: var(--gray-200);
  --hairline: var(--gray-100);
  /* Translucent so it stays visible on white, gray and coral row tints. */
  --row-divider: rgba(16, 24, 40, .08);
  --control-border: var(--gray-300);

  /* Shape rule: controls and business marks 8px, panels 14px, pills and people full. */
  --r-control: 8px;
  --r-panel: 14px;
  --r-full: 999px;
  --shadow-panel: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px -18px rgba(16, 24, 40, .16);
  --ease-out: cubic-bezier(.16, 1, .3, 1);

  /* Type weights by role (docs/design-system.md, Confident). */
  --w-display: 400; --w-heading: 400; --w-title: 600; --w-name: 600; --w-amount: 500; --w-ui: 500; --w-strong: 600; --w-button: 600;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: Outfit, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px;
  color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p, dl, dd, ol, ul, figure { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 16px; height: 16px; flex: none; display: block; stroke-width: 1.75; }
:focus-visible { outline: 2px solid var(--brand-700); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ccy { font-size: .72em; font-weight: var(--w-ui); letter-spacing: .04em; color: var(--text-3); }
.money { white-space: nowrap; }
[hidden] { display: none !important; }

/* Shell */
.app { display: flex; min-height: 100dvh; }
.sidebar { position: sticky; top: 0; height: 100dvh; width: 248px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.sb-top { padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
.company { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 0; background: none; border-radius: var(--r-control); text-align: left; }
.company:hover { background: var(--gray-50); }
.company img { width: 32px; height: 32px; border-radius: var(--r-control); }
.company-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.company-name { font-weight: var(--w-name); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.company-role { font-size: 12px; line-height: 16px; color: var(--text-3); }
.company .ic { color: var(--gray-400); }
.search { display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r-control); background: var(--gray-50); color: var(--text-3); }
.search span { flex: 1; text-align: left; }
kbd { font: inherit; font-size: 11px; line-height: 16px; color: var(--text-3); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; background: var(--surface); }
.sb-nav { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
.sb-group { margin-top: 16px; }
.sb-label { padding: 0 8px 4px; font-size: 12px; line-height: 16px; color: var(--gray-400); font-weight: var(--w-ui); }
.sb-link { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border-radius: var(--r-control); color: var(--gray-700); text-decoration: none; transition: background-color .15s ease; }
.sb-link:hover { background: var(--gray-50); }
.sb-link .ic { color: var(--gray-400); }
.sb-link.is-active { background: var(--brand-50); color: var(--brand-800); font-weight: var(--w-ui); }
.sb-link.is-active .ic { color: var(--brand-700); }
.count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-full); background: var(--brand-100); color: var(--brand-800); font-size: 12px; font-weight: var(--w-strong); display: inline-flex; align-items: center; justify-content: center; }
.sb-user { display: flex; align-items: center; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--border); }
.sb-user .who { min-width: 0; }
.sb-user .who p:first-child { font-weight: var(--w-name); }
.sb-user .who p:last-child { font-size: 12px; line-height: 16px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: none; }
.main { width: 100%; max-width: 1320px; margin: 0 auto; padding: 24px 32px 72px; }

/* Atoms */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-panel); box-shadow: var(--shadow-panel); }
.panel-flat { box-shadow: none; }
.person, .business { width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: var(--w-strong); letter-spacing: .02em; color: var(--gray-700); }
.person { border-radius: var(--r-full); background: var(--gray-100); }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px 0 6px; border-radius: var(--r-full); font-size: 12px; font-weight: var(--w-ui); white-space: nowrap; flex: none; }
.pill .ic { width: 13px; height: 13px; }
.pill-neutral { background: var(--gray-100); color: var(--gray-700); }
.pill-warn { background: var(--warn-50); color: var(--warn-700); }
.pill-error { background: var(--error-50); color: var(--error-700); }
.pill-success { background: var(--success-50); color: var(--success-700); }
/* Status: a filled tint means it needs attention or money is moving; an outline means it's only a record. Always a text label, never colour alone. */
.status { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border: 1px solid transparent; border-radius: var(--r-full); font-size: 12px; font-weight: var(--w-ui); white-space: nowrap; flex: none; }
.status.is-waiting { background: var(--warn-50); color: var(--warn-700); }
.status.is-moving { background: var(--blue-50); color: var(--blue-700); }
.status.is-paid { background: var(--success-50); color: var(--success-700); }
.status.is-failed { background: var(--error-50); color: var(--error-700); }
.status.is-rejected { background: var(--gray-100); color: var(--gray-700); }
.status.is-quiet { background: var(--surface); border-color: var(--border); color: var(--text-2); }
@keyframes beat { 0%, 100% { box-shadow: 0 0 0 0 rgba(46, 144, 250, .5); } 60% { box-shadow: 0 0 0 4px rgba(46, 144, 250, 0); } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-control); border: 1px solid transparent; font-size: 14px; font-weight: var(--w-button); white-space: nowrap; text-decoration: none; transition: background-color .15s ease, border-color .15s ease, transform .15s var(--ease-out); }
.btn .ic { width: 16px; height: 16px; }
.btn-primary { background: var(--brand-500); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--brand-600); }
.btn-primary .ccy { color: #fff; }
.btn-outline { background: var(--surface); border-color: var(--control-border); color: var(--gray-700); }
.btn-outline:hover:not(:disabled) { background: var(--gray-50); }
.btn-ghost { background: none; color: var(--gray-600); }
.btn-ghost:hover:not(:disabled) { background: var(--gray-100); color: var(--gray-900); }
.btn-lg { height: 44px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; border-radius: var(--r-control); color: var(--gray-500); }
.icon-btn:hover { background: var(--gray-100); color: var(--gray-700); }
.text-link { padding: 0; border: 0; background: none; border-radius: 4px; color: var(--brand-800); font-weight: var(--w-ui); text-decoration: underline; text-decoration-color: var(--brand-100); text-underline-offset: 3px; }
.text-link:hover { text-decoration-color: currentColor; }
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-control); font-size: 14px; line-height: 20px; }
.callout > .ic { margin-top: 2px; }
.callout-title { font-weight: var(--w-ui); }
.callout ul { margin: 4px 0 0; padding-left: 18px; }
.callout ul li + li { margin-top: 2px; }
.callout-warn { background: var(--warn-50); color: var(--warn-700); }
.callout-error { background: var(--error-50); color: var(--error-700); }
.callout-neutral { background: var(--gray-100); color: var(--gray-700); }
.callout-success { background: var(--success-50); color: var(--success-700); }
.skel { border-radius: var(--r-control); background: var(--gray-100); }
input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--brand-700); cursor: pointer; }
input[type="checkbox"]:disabled { cursor: not-allowed; }

/* Mock-only strip */
.mock-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 12px; margin-bottom: 20px; border: 1px dashed var(--control-border); border-radius: var(--r-control); font-size: 12px; line-height: 16px; color: var(--text-3); }
.mock-strip strong { font-weight: 500; color: var(--text-2); }
.mock-strip label { display: inline-flex; align-items: center; gap: 6px; }
.mock-strip select { height: 28px; padding: 0 6px; border: 1px solid var(--control-border); border-radius: 6px; background: var(--surface); font-size: 12px; }

/* Page */
.page-title { font-size: 24px; line-height: 32px; font-weight: var(--w-heading); letter-spacing: -0.02em; }
.page-sub { margin-top: 4px; color: var(--text-2); max-width: 70ch; }
.tabs { margin-top: 20px; display: flex; gap: 24px; border-bottom: 1px solid var(--border); }
.tab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0; border: 0; background: none; color: var(--text-2); font-size: 14px; font-weight: var(--w-ui); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 1px; background: var(--gray-900); }
.tab-count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-full); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; background: var(--gray-100); color: var(--gray-700); }
.tab-count.is-error { background: var(--error-50); color: var(--error-700); }
.banners { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.banners:empty { display: none; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; }
.banner .ic { width: 20px; height: 20px; margin-top: 1px; }
.banner-main { flex: 1; min-width: 0; }
.banner-title { font-weight: var(--w-title); }
.banner p + p { margin-top: 2px; color: var(--text-2); }
.banner.is-success .ic { color: var(--success-700); }
.banner.is-warn .ic { color: var(--warn-600); }

.layout { margin-top: 16px; display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 16px; align-items: start; }
.layout.is-empty { grid-template-columns: minmax(0, 1fr); }

/* Queue */
.queue { overflow: hidden; display: flex; flex-direction: column; }
.queue-head { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 16px; border-bottom: 1px solid var(--hairline); }
.queue-head .hint { flex: 1; color: var(--text-2); }
.queue-head .sum { color: var(--text-3); font-size: 12px; line-height: 16px; white-space: nowrap; }
.select-all { display: inline-flex; align-items: center; gap: 10px; color: var(--text-2); cursor: pointer; }
.claims { list-style: none; padding: 0; }
.claim { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: stretch; border-bottom: 1px solid var(--row-divider); transition: background-color .15s ease; }
.claim.no-check { grid-template-columns: minmax(0, 1fr); }
.claim:hover { background: var(--gray-25); }
.claim.is-active { background: var(--gray-50); box-shadow: inset 3px 0 0 var(--gray-900); }
.claim.is-selected { background: var(--brand-50); }
.claim.is-selected.is-active { box-shadow: inset 3px 0 0 var(--brand-700); }
.check { display: flex; align-items: flex-start; justify-content: center; padding-top: 22px; padding-left: 8px; cursor: pointer; }
.claim-btn { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 16px 14px 8px; border: 0; background: none; text-align: left; width: 100%; }
.no-check .claim-btn { padding-left: 16px; }
.claim-main { min-width: 0; }
.claim-name { display: block; font-size: 16px; line-height: 24px; font-weight: var(--w-name); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.claim-sub { display: block; font-size: 14px; line-height: 20px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.claim-flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.claim-flags:empty { display: none; }
.claim-amount { font-size: 16px; line-height: 24px; font-weight: var(--w-amount); white-space: nowrap; }
.queue-foot { padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
.queue-empty, .queue-error { padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--text-2); }
.queue-empty .ic, .queue-error .ic { width: 28px; height: 28px; }
.queue-empty .ic { color: var(--success-700); }
.queue-error .ic { color: var(--error-700); }
.queue-empty strong, .queue-error strong { color: var(--text); font-weight: var(--w-title); font-size: 16px; line-height: 24px; }
.skel-row { display: grid; grid-template-columns: 36px 1fr 72px; gap: 12px; padding: 16px; border-bottom: 1px solid var(--hairline); }

.selection-bar { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -8px 24px -16px rgba(16, 24, 40, .2); }
.selection-bar .what { flex: 1 1 160px; min-width: 0; }
.selection-bar .what strong { font-weight: var(--w-name); }
.selection-bar .clear { margin-top: 2px; font-size: 12px; line-height: 16px; }
.selection-bar .limit { flex-basis: 100%; font-size: 12px; line-height: 16px; color: var(--text-3); }

/* Detail pane */
.pane { position: sticky; top: 16px; max-height: calc(100dvh - 32px); display: flex; flex-direction: column; overflow: hidden; }
.pane-scroll { flex: 1; overflow-y: auto; padding: 20px 24px; }
.pane-head { display: flex; align-items: flex-start; gap: 12px; }
.pane-head-main { flex: 1; min-width: 0; }
.pane-merchant { font-size: 18px; line-height: 26px; font-weight: var(--w-title); overflow-wrap: anywhere; }
.pane-who { color: var(--text-2); }
.pane-amount { text-align: right; }
.pane-amount .big { font-size: 24px; line-height: 32px; font-weight: var(--w-heading); letter-spacing: -0.02em; white-space: nowrap; }
.pane-amount .status { margin-top: 4px; display: flex; justify-content: flex-end; }
.pane-grid { margin-top: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; }
.pane-info { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.description { color: var(--gray-700); white-space: pre-wrap; }
.details { display: flex; flex-direction: column; }
.details div { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--hairline); }
.details div:first-child { border-top: 0; padding-top: 0; }
.details dt { color: var(--text-3); }
.details dd { overflow-wrap: anywhere; }
.details .sub { display: block; font-size: 12px; line-height: 16px; color: var(--text-3); }
.pane-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 24px; border-top: 1px solid var(--border); background: var(--surface); }
.pane-actions .spacer { flex: 1; }
.pane-select { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); cursor: pointer; }
.read-only { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 14px; }

.receipts { display: flex; flex-direction: column; gap: 16px; }
.viewer { border: 1px solid var(--border); border-radius: var(--r-control); background: var(--gray-50); overflow: hidden; }
.viewer-stage { min-height: 340px; padding: 20px; display: flex; align-items: center; justify-content: center; }
.viewer-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--surface); font-size: 12px; line-height: 16px; color: var(--text-3); }
.viewer-bar .text-link { font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.viewer-bar .text-link .ic { width: 12px; height: 12px; }
.paper { width: 100%; max-width: 280px; padding: 18px 18px 14px; background: #fff; border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 8px 24px -12px rgba(16, 24, 40, .25); font-size: 12px; line-height: 18px; transform: rotate(-0.6deg); }
.paper.is-pdf { transform: none; border-radius: 2px; max-width: 300px; }
.paper.is-screen { transform: none; border-radius: 16px; max-width: 240px; padding: 20px 16px; }
.paper-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 13px; }
.paper-head span:last-child { color: var(--text-3); font-weight: 500; letter-spacing: .06em; font-size: 11px; }
.paper-sub { color: var(--text-3); margin-bottom: 10px; }
.paper-line { display: flex; justify-content: space-between; gap: 8px; color: var(--text-2); }
.paper-total { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--gray-300); font-weight: 600; }
.sms { width: 100%; max-width: 320px; padding: 14px 16px; border-radius: 16px 16px 16px 4px; background: var(--surface); border: 1px solid var(--border); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 20px; }
.no-receipt { min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; border: 1px dashed var(--control-border); border-radius: var(--r-control); color: var(--text-2); text-align: center; }
.no-receipt .ic { width: 24px; height: 24px; color: var(--text-3); }

.reject-form { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.reject-form label { font-size: 14px; color: var(--text); }
.reject-form textarea { width: 100%; min-height: 88px; padding: 10px 12px; resize: vertical; border: 1px solid var(--control-border); border-radius: var(--r-control); background: var(--surface); }
.reject-form textarea[aria-invalid="true"] { border-color: var(--error-700); }
.reject-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 16px; color: var(--text-3); }
.field-error { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--error-700); }
.field-error .ic { width: 14px; height: 14px; }
.reject-buttons { display: flex; gap: 8px; }

/* Review sheet */
.sheet-layer { position: fixed; inset: 0; z-index: 50; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(16, 24, 40, .24); }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(520px, 100%); display: flex; flex-direction: column; background: var(--surface); box-shadow: -16px 0 48px -16px rgba(16, 24, 40, .2); }
.sheet:focus { outline: none; }
.sheet-head { display: flex; gap: 12px; align-items: flex-start; padding: 20px 20px 18px 24px; border-bottom: 1px solid var(--border); }
.sheet-head-main { flex: 1; min-width: 0; }
.eyebrow { font-size: 12px; line-height: 16px; color: var(--text-3); }
.sheet-title { margin-top: 2px; font-size: 18px; line-height: 26px; font-weight: var(--w-title); }
.sheet-body { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.sheet-body.is-detail { padding: 0; }
.sheet-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--border); }
.note { display: flex; gap: 8px; align-items: flex-start; color: var(--text-2); }
.note .ic { margin-top: 2px; color: var(--text-3); }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 70; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: var(--r-panel); background: var(--gray-900); color: #fff; font-size: 14px; box-shadow: 0 16px 40px -16px rgba(16, 24, 40, .5); opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .2s ease, transform .3s var(--ease-out); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.scrim { position: fixed; inset: 0; z-index: 39; background: rgba(16, 24, 40, .24); }

@media (prefers-reduced-motion: no-preference) {

@keyframes fade { from { opacity: 0; } }

@keyframes pulse { 50% { opacity: .55; } }

<script>
const LUCIDE_NAMES = {
  "dashboard": "LayoutDashboard", "wallet": "Wallet", "approve": "CircleCheck", "check-circle": "CircleCheck",
  "receipt": "ReceiptText", "file": "FileText", "repeat": "Repeat", "banknote": "Banknote", "building": "Building2",
  "users": "Users", "settings": "Settings", "chart": "ChartColumn", "activity": "Activity", "search": "Search",
  "chevrons": "ChevronsUpDown", "chevron-down": "ChevronDown", "check": "Check", "x": "X", "alert": "TriangleAlert",
  "circle-alert": "CircleAlert", "info": "Info", "menu": "Menu", "key": "KeyRound", "lock": "Lock", "external": "ExternalLink",
  "copy": "Copy", "eye": "Eye", "rotate": "RotateCcw", "clock": "Clock", "image-off": "ImageOff", "message": "MessageSquareText",
};
const SVG_NS = "http://www.w3.org/2000/svg";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (selector) => document.querySelector(selector);
const later = (fn, ms) => setTimeout(fn, reduceMotion ? Math.min(ms, 250) : ms);

function icon(name) {
  const node = window.lucide?.[LUCIDE_NAMES[name]];
  if (!node) return document.createElement("span");
  const svg = window.lucide.createElement(node);
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("class", "ic");
  svg.removeAttribute("width");
  svg.removeAttribute("height");
  return svg;
}
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (value == null || value === false) continue;
    if (key === "class") el.className = value;
    else if (key === "text") el.textContent = value;
    else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) if (child != null && child !== false) el.append(child);
  return el;
}
document.querySelectorAll("i[data-icon]").forEach((el) => el.replaceWith(icon(el.dataset.icon)));

/* Money and dates */
const MAX_CLAIMS = 20;
const PAGE_SIZE = 20;
const REASON_MIN = 5;
const REASON_MAX = 500;
const kesText = (cents) => (cents / 100).toLocaleString("en-KE", { minimumFractionDigits: cents % 100 ? 2 : 0, maximumFractionDigits: 2 });
const kes = (cents) => h("span", { class: "money num" }, h("span", { class: "ccy", text: "KES" }), " ", kesText(cents));
const usdcText = (n) => n.toLocaleString("en-KE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usdc = (n) => h("span", { class: "money num" }, usdcText(n), " ", h("span", { class: "ccy", text: "USDC" }));
const dateText = (iso) => new Date(`${iso}T00:00:00Z`).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const firstName = (name) => name.split(" ")[0];

/* Toast and mock-only links */
const toastEl = $("#toast");
let toastTimer;
function toast(message) {
  toastEl.replaceChildren(icon("check"), h("span", { text: message }));
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
}
document.addEventListener("click", (event) => {
  const trigger = event.target.closest("[data-mock]");
  if (!trigger) return;
  event.preventDefault();
  toast(`${trigger.dataset.mock} isn't part of this mock.`);
});

/* Sample claims */
function baseClaims() {

      receipts: [{ kind: "photo", paper: { heading: "Java House Westlands", label: "RECEIPT", sub: "4 Nov 2026, 13:42", lines: [["2 × Chicken wrap", 1900], ["2 × Fresh juice", 700], ["Service", 600]] } }], warnings: [] },
    { id: "c2", merchant: "Matatu fares", name: "Faith Wambui", email: "faith@mwangaza.co.ke", phone4: "6109", spentOn: "2026-11-05", category: "Fuel & transport", amount: 145000,
      description: "Site visits to the Embakasi warehouse: CBD to Industrial Area, on to Embakasi, and back.", mpesa: null, etims: "not_required", receipts: [], warnings: [] },
    { id: "c3", merchant: "Rubis Westlands", name: "Kevin Mwangi", email: "kevin@mwangaza.co.ke", phone4: "0482", spentOn: "2026-11-02", category: "Fuel & transport", amount: 500000,
      description: "Fuel for the delivery van KDM 412T.", mpesa: "SK29J4LMN7", etims: "none",
      receipts: [{ kind: "sms_text", text: "SK29J4LMN7 Confirmed. Ksh5,000.00 paid to RUBIS WESTLANDS on 2/11/26 at 7:42 AM. New M-PESA balance is Ksh3,214.50. Transaction cost, Ksh0.00." }],
      warnings: [{ code: "near_duplicate", amount: 500000, spentOn: "2026-10-30" }] },
    { id: "c4", merchant: "Text Book Centre Sarit", name: "Grace Achieng", email: "grace@mwangaza.co.ke", phone4: "7310", spentOn: "2026-11-03", category: "Office & supplies", amount: 273950,
      description: "Printer toner and two box files.", mpesa: "SK37P2DD8W", etims: "attached", invoice: "0040834512",
      receipts: [{ kind: "pdf", paper: { heading: "Text Book Centre Ltd", label: "TAX INVOICE", sub: "TBC-SAR-88214, 3 Nov 2026", lines: [["HP 305 toner", 2189.5], ["Box file × 2", 550]] } }], warnings: [] },
    { id: "c5", merchant: "Shell Mombasa Road", name: "Daniel Kiprop", email: "daniel@mwangaza.co.ke", phone4: "9905", spentOn: "2026-08-12", category: "Fuel & transport", amount: 680000,
      description: "Fuel for the Mombasa delivery run.", mpesa: "SH81QW3E5R", etims: "none",
      receipts: [{ kind: "photo", paper: { heading: "Shell Mombasa Road", label: "FUEL SALE", sub: "12 Aug 2026, 06:15", lines: [["Diesel 37.8 L", 6800]] } }],

    { id: "c6", merchant: "Uber", name: "Amina Hassan", email: "amina@mwangaza.co.ke", phone4: "3321", spentOn: "2026-11-05", category: "Fuel & transport", amount: 128000,

      receipts: [{ kind: "screenshot", paper: { heading: "Uber", label: "TRIP", sub: "5 Nov 2026, 10:05", lines: [["Westlands to Upper Hill", 1280]] } }], warnings: [] },
  ];
}
function failedClaims() {
  return [
    { id: "f1", merchant: "Naivas Kilimani", name: "Peter Njoroge", email: "peter@mwangaza.co.ke", phone4: "5512", spentOn: "2026-10-30", category: "Office & supplies", amount: 395000,
      description: "Cleaning supplies for the office.", mpesa: "SK10M3NB7T", etims: "attached", invoice: "0040819937",
      receipts: [{ kind: "photo", paper: { heading: "Naivas Kilimani", label: "RECEIPT", sub: "30 Oct 2026, 17:20", lines: [["Cleaning supplies", 3950]] } }], warnings: [],
      failure: "The M-Pesa number didn't accept the payment." },
  ];
}
function busyMonthClaims() {
  const people = [["Brian Otieno", "2448"], ["Faith Wambui", "6109"], ["Kevin Mwangi", "0482"], ["Grace Achieng", "7310"], ["Daniel Kiprop", "9905"], ["Peter Njoroge", "5512"]];
  const spends = [["Total Energies Ngong Rd", "Fuel & transport", 450000], ["Artcaffe Westgate", "Meals & entertainment", 236000], ["Safaricom airtime", "Airtime & internet", 100000],
    ["Bolt", "Fuel & transport", 64000], ["Carrefour Junction", "Office & supplies", 187500], ["JKIA parking", "Fuel & transport", 30000]];
  return Array.from({ length: 17 }, (_, i) => {
    const [name, phone4] = people[i % people.length];
    const [merchant, category, amount] = spends[i % spends.length];
    const day = String(20 + (i % 10)).padStart(2, "0");
    return { id: `b${i}`, merchant, name, email: `${firstName(name).toLowerCase()}@mwangaza.co.ke`, phone4, spentOn: `2026-10-${day}`, category, amount,
      description: "", mpesa: `SJ${(48213 + i * 37).toString(36).toUpperCase()}Q`, etims: "none",
      receipts: [{ kind: "photo", paper: { heading: merchant, label: "RECEIPT", sub: `${Number(day)} Oct 2026`, lines: [["Total", amount / 100]] } }], warnings: [] };
  });
}

/* State */
const state = { role: "admin", scenario: "normal", tab: "waiting", waiting: [], failed: [], shown: PAGE_SIZE, activeId: null, selected: [], loading: true, loadError: false,
  banners: [], rejecting: null, busy: false, costChanged: false };
const initials = (name) => name.split(" ").map((s) => s[0]).join("");
const canAct = () => state.role !== "accountant";
const canPay = () => state.role === "admin";
const blockedReason = (c) => c.blocked === "phone" ? "Can't be paid until they confirm their M-Pesa number in the app." : c.blocked === "name" ? "Can't be paid until they add their name in the app." : null;
const queueItems = () => (state.tab === "waiting" ? state.waiting.slice(0, state.shown) : state.failed);
const findClaim = (id) => state.waiting.find((c) => c.id === id) ?? state.failed.find((c) => c.id === id);

function reset() {
  state.role = $("#mock-role").value;
  state.scenario = $("#mock-scenario").value;
  state.tab = "waiting";
  state.waiting = state.scenario === "empty" ? [] : [...baseClaims(), ...(state.scenario === "long" ? busyMonthClaims() : [])];
  state.failed = state.scenario === "empty" ? [] : failedClaims();
  state.shown = PAGE_SIZE;
  state.selected = [];
  state.banners = [];
  state.rejecting = null;
  state.busy = false;
  state.costChanged = false;
  state.activeId = state.waiting[0]?.id ?? null;
  state.loading = true;
  state.loadError = false;
  $("#role-label").textContent = state.role === "accountant" ? "Accountant" : "Admin";
  renderAll();
  later(() => {
    state.loading = false;
    state.loadError = state.scenario === "error";
    renderAll();
  }, 600);
}
$("#mock-role").addEventListener("change", reset);
$("#mock-scenario").addEventListener("change", reset);

/* Rendering */
function renderAll() {
  renderHeader();
  renderTabs();
  renderBanners();
  renderQueue();
  renderPane();
  $("#nav-count").textContent = String(state.waiting.length);
  $("#nav-count").hidden = state.waiting.length === 0;
}

function renderHeader() {
  $("#page-sub").textContent = canAct()
    ? `Check each receipt, then approve and pay up to ${MAX_CLAIMS} reimbursements with one passkey. Each one is paid on its own.`
    : "Reimbursements waiting for an admin, and payments that failed. Only admins approve and pay.";
}

function renderTabs() {
  const tabs = [{ id: "waiting", label: "Waiting for approval", count: state.waiting.length }];
  if (state.failed.length > 0) tabs.push({ id: "failed", label: "Payment failed", count: state.failed.length, error: true });
  if (!tabs.some((t) => t.id === state.tab)) state.tab = "waiting";
  $("#tabs").replaceChildren(...tabs.map((t) => h("button", {
    class: "tab", type: "button", role: "tab", "aria-selected": String(state.tab === t.id), id: `tab-${t.id}`, "aria-controls": "queue",
    onclick: () => { if (state.tab === t.id) return; state.tab = t.id; state.activeId = queueItems()[0]?.id ?? null; state.rejecting = null; renderAll(); },
  }, t.label, state.loading ? null : h("span", { class: `tab-count num${t.error ? " is-error" : ""}`, text: String(t.count) }))));
}

function renderBanners() {
  const nodes = [];
  if (state.role === "no-passkey") {
    nodes.push(h("div", { class: "panel panel-flat banner", role: "note" }, icon("key"),
      h("div", { class: "banner-main" },
        h("p", { class: "banner-title", text: "Set up your approval passkey first" }),
        h("p", { text: "Paying needs your approval passkey. Set it up in the Expendi Business app; then confirm here with “use a phone or tablet” in your browser's passkey prompt." }))));
  }
  for (const b of state.banners) {
    nodes.push(h("div", { class: `panel panel-flat banner is-${b.tone}`, role: "status" }, icon(b.tone === "success" ? "check-circle" : "alert"),
      h("div", { class: "banner-main" }, h("p", { class: "banner-title", text: b.title }), h("p", { text: b.body }), b.reason ? h("p", { text: b.reason }) : null),
      h("button", { class: "btn btn-outline", type: "button", text: "Done", onclick: () => { state.banners = state.banners.filter((x) => x !== b); renderBanners(); } })));
  }
  $("#banners").replaceChildren(...nodes);
}

function warningBadges(c) {
  const labels = { near_duplicate: "Possible duplicate", older_than_60_days: "Over 60 days old" };
  return [...new Set(c.warnings.map((w) => w.code))].map((code) => h("span", { class: "pill pill-warn" }, icon("alert"), labels[code]));
}
function claimFlags(c) {
  const flags = warningBadges(c);
  if (state.tab === "failed") flags.unshift(h("span", { class: "status is-failed", text: "Payment failed" }));
  if (blockedReason(c)) flags.push(h("span", { class: "pill pill-neutral" }, icon("lock"), "Can't be paid yet"));
  if (c.receipts.length === 0) flags.push(h("span", { class: "pill pill-neutral" }, "No receipt"));
  return flags;
}

function selectable(c) {
  return canPay() && state.tab === "waiting" && !blockedReason(c) && !state.busy;
}
function toggle(id) {
  if (state.selected.includes(id)) state.selected = state.selected.filter((x) => x !== id);
  else if (state.selected.length < MAX_CLAIMS) state.selected = [...state.selected, id];
  renderQueue();
  renderPane();
}

function renderQueue() {
  const queue = $("#queue");
  const layout = $("#layout");
  layout.classList.remove("is-empty");
  $("#pane").hidden = false;

          p.rounded ? h("div", {}, h("dt", { text: "Claimed" }), h("dd", {}, kes(p.c.amount), ", rounded up to a whole shilling for M-Pesa")) : null,
          h("div", {}, h("dt", { text: "Paid to" }), h("dd", { class: "num", text: `${p.c.name}, M-Pesa ending ${p.c.phone4}` })),
          h("div", {}, h("dt", { text: "USDC" }), h("dd", {}, mark(usdc(p.usdc)))),

    const failedClaim = previews[0].c;
    const reason = "The M-Pesa number didn't accept the payment.";
    banner = { tone: "warn", title: "A payment failed", body: "No money reached M-Pesa for it, and the USDC stays in or returns to the wallet. You can retry it under Payment failed.", reason };
    removeClaims(ids, "waiting");
    state.failed = [{ ...failedClaim, failure: reason }, ...state.failed];
  } else if (state.scenario === "review") {
    banner = { tone: "warn", title: "Expendi is checking a payment", body: "Its outcome isn't clear yet. Don't pay it again: Expendi will settle it." };
    removeClaims(ids, isRetry ? "failed" : "waiting");
  } else {
    banner = { tone: "success", title: "Payments sent", body: previews.length === 1 ? "It usually reaches M-Pesa within a minute or two." : "They usually reach M-Pesa within a minute or two." };
    removeClaims(ids, isRetry ? "failed" : "waiting");
  }
  state.banners = [banner];
  closeSheet();
  renderAll();
  $("#banners .banner:last-child button")?.focus({ preventScroll: false });
}

function removeClaims(ids, from) {
  state[from] = state[from].filter((c) => !ids.includes(c.id));
  state.selected = state.selected.filter((id) => !ids.includes(id));
  if (!findClaim(state.activeId) || !queueItems().some((c) => c.id === state.activeId)) {
    if (state.tab === "failed" && state.failed.length === 0) state.tab = "waiting";
    state.activeId = queueItems()[0]?.id ?? null;
  }
  renderAll();
}

/* Mobile navigation */
const sidebar = $("#sidebar");
const scrim = $("#scrim");
const menuBtn = $("#menu-btn");
function setNav(open) {
  sidebar.classList.toggle("is-open", open);
  scrim.hidden = !open;
  menuBtn.setAttribute("aria-expanded", String(open));
  if (open) sidebar.querySelector(".sb-link")?.focus();
}
menuBtn.addEventListener("click", () => setNav(true));
scrim.addEventListener("click", () => setNav(false));
document.addEventListener("keydown", (event) => { if (event.key === "Escape" && sidebar.classList.contains("is-open")) { setNav(false); menuBtn.focus(); } });

reset();
</script>
</body>
</html>
